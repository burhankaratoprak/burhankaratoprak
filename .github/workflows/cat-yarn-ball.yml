name: Generate Cat Playing with Yarn Ball

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Contribution Grid with Platane/snk
        uses: Platane/snk@master
        with:
          github_user_name: burhankaratoprak
          svg_out_path: dist/snake.svg
          gif_out_path: dist/snake.gif
          theme: random
      
      - name: Combine Snake with Cat Animation
        run: |
          mkdir -p output
          python3 << 'EOF'
          import re
          
          def combine_snake_cat(snake_file, output_file):
              try:
                  with open(snake_file, 'r', encoding='utf-8') as f:
                      snake_svg = f.read()
                  
                  # Extract viewBox and width/height from snake SVG
                  viewbox_match = re.search(r'viewBox="([^"]+)"', snake_svg)
                  width_match = re.search(r'width="([^"]+)"', snake_svg)
                  height_match = re.search(r'height="([^"]+)"', snake_svg)
                  
                  viewbox = viewbox_match.group(1) if viewbox_match else "0 0 800 200"
                  width = width_match.group(1) if width_match else "800"
                  height = height_match.group(1) if height_match else "200"
                  
                  # Remove the svg tags from snake_svg to get inner content
                  inner_content = re.sub(r'<svg[^>]*>', '', snake_svg)
                  inner_content = re.sub(r'</svg>', '', inner_content)
                  
                  # Create enhanced SVG with cat emoji
                  cat_svg = f'''<svg viewBox="{viewbox}" width="{width}" height="{height}" xmlns="http://www.w3.org/2000/svg">
                    <title>Cat playing with yarn ball - contribution grid</title>
                    <style>
                      @keyframes catMove {{
                        0%, 100% {{ transform: translate(0, 0); }}
                        50% {{ transform: translate(20px, -10px); }}
                      }}
                      .cat {{ animation: catMove 2s ease-in-out infinite; font-size: 24px; }}
                    </style>
                    {inner_content}
                    <text x="50%" y="30" font-size="24" text-anchor="middle" class="cat">🐱</text>
                  </svg>'''
                  
                  with open(output_file, 'w', encoding='utf-8') as f:
                      f.write(cat_svg)
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  # Fallback: just copy snake file
                  with open(snake_file, 'r', encoding='utf-8') as f_in:
                      with open(output_file, 'w', encoding='utf-8') as f_out:
                          f_out.write(f_in.read())
          
          combine_snake_cat('dist/snake.svg', 'output/github-contribution-grid-cat.svg')
          EOF
      
      - name: Generate Dark Version
        uses: Platane/snk@master
        with:
          github_user_name: burhankaratoprak
          svg_out_path: dist/snake-dark.svg
          theme: dark
      
      - name: Combine Dark Snake with Cat
        run: |
          python3 << 'EOF'
          import re
          
          def combine_snake_cat(snake_file, output_file):
              try:
                  with open(snake_file, 'r', encoding='utf-8') as f:
                      snake_svg = f.read()
                  
                  viewbox_match = re.search(r'viewBox="([^"]+)"', snake_svg)
                  width_match = re.search(r'width="([^"]+)"', snake_svg)
                  height_match = re.search(r'height="([^"]+)"', snake_svg)
                  
                  viewbox = viewbox_match.group(1) if viewbox_match else "0 0 800 200"
                  width = width_match.group(1) if width_match else "800"
                  height = height_match.group(1) if height_match else "200"
                  
                  # Remove the svg tags from snake_svg to get inner content
                  inner_content = re.sub(r'<svg[^>]*>', '', snake_svg)
                  inner_content = re.sub(r'</svg>', '', inner_content)
                  
                  cat_svg = f'''<svg viewBox="{viewbox}" width="{width}" height="{height}" xmlns="http://www.w3.org/2000/svg">
                    <title>Cat playing with yarn ball - contribution grid (dark)</title>
                    <style>
                      @keyframes catMove {{
                        0%, 100% {{ transform: translate(0, 0); }}
                        50% {{ transform: translate(20px, -10px); }}
                      }}
                      .cat {{ animation: catMove 2s ease-in-out infinite; font-size: 24px; }}
                    </style>
                    {inner_content}
                    <text x="50%" y="30" font-size="24" text-anchor="middle" class="cat">🐱</text>
                  </svg>'''
                  
                  with open(output_file, 'w', encoding='utf-8') as f:
                      f.write(cat_svg)
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  with open(snake_file, 'r', encoding='utf-8') as f_in:
                      with open(output_file, 'w', encoding='utf-8') as f_out:
                          f_out.write(f_in.read())
          
          combine_snake_cat('dist/snake-dark.svg', 'output/github-contribution-grid-cat-dark.svg')
          EOF
      
      - name: Push files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/ output/
          git commit -m "Update cat playing with yarn ball animation" || exit 0
          git push

