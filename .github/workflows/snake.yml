name: Generate Snake

on:
  push:          # her push’ta çalışsın
  schedule:
    - cron: "0 3 * * *"   # opsiyonel: günlük
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: burhankaratoprak
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake*.svg
          git commit -m "chore: update snake svg" || exit 0
          git push
